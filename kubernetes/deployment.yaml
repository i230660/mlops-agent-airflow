apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-inference
  namespace: mlops-demo
  labels:
    app: ml-inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-inference
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ml-inference
      annotations:
        # Provenance read by the agent's k8s_app_version tool. Update on each release.
        model-version: "v1"
        dataset-version: "md5-REPLACE_AFTER_DVC_ADD"
        mlflow-run-id: "REPLACE_WITH_RUN_ID"
    spec:
      containers:
        - name: api
          image: mlops-inference:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ml-inference-config
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
