name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CI subset; external services are mocked)
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn "pydantic>=2.6" requests pyyaml pytest pytest-cov ruff httpx scikit-learn pandas joblib
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=agent --cov-report=term-missing
