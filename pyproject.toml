[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-agent"
version = "1.0.0"
description = "Production-ready MLOps AI agent (DVC, MLflow, Airflow, Kubernetes)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "requests>=2.31",
  "mlflow>=2.12",
  "kubernetes>=29.0",
  "pyyaml>=6.0",
  "google-genai>=1.0",
  "scikit-learn>=1.4",
  "pandas>=2.1",
  "joblib>=1.3",
  "dvc>=3.50",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["agent*", "api*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E501"]
